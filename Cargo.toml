[package]
name = "filling-triangles"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = [
    "SUPPORT_IMAGE_GENERATION",
    "SUPPORT_IMAGE_EXPORT",
    "SUPPORT_FILEFORMAT_PNG",
] }

[profile.dev]
opt-level = 3
debug = false

# Simbolos de depuracion en release para que el flamegraph muestre nombres
# de funciones; no cambian el codigo que se genera.
[profile.release]
debug = true
